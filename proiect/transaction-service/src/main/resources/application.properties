spring.application.name=transaction-service
server.port=8083
spring.profiles.active=dev
spring.jpa.show-sql=true

bnr.url=https://www.bnr.ro/nbrfxrates.xml

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=3
eureka.instance.lease-renewal-interval-in-seconds=3

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always

eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.cloud.loadbalancer.cache.ttl=2s
management.info.env.enabled=true

# Resilience4j Aspect Order (CircuitBreaker outer, Retry inner)
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2

# Resilience4j Circuit Breaker configuration
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.record-exceptions=feign.FeignException,java.io.IOException,java.util.concurrent.TimeoutException,com.example.transactionservice.exceptions.ServiceUnavailableException,java.lang.IllegalStateException
resilience4j.circuitbreaker.instances.accountServiceCircuitBreaker.ignore-exceptions=com.example.transactionservice.exceptions.ResourceNotFoundException,org.springframework.security.access.AccessDeniedException,java.lang.IllegalArgumentException

# Resilience4j Retry configuration (safe read operations only)
resilience4j.retry.instances.accountServiceRetry.max-attempts=3
resilience4j.retry.instances.accountServiceRetry.wait-duration=500ms
resilience4j.retry.instances.accountServiceRetry.retry-exceptions=feign.FeignException,java.io.IOException,java.util.concurrent.TimeoutException,com.example.transactionservice.exceptions.ServiceUnavailableException,java.lang.IllegalStateException
resilience4j.retry.instances.accountServiceRetry.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException,com.example.transactionservice.exceptions.ResourceNotFoundException,org.springframework.security.access.AccessDeniedException,java.lang.IllegalArgumentException

# OpenFeign timeouts
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=3000
